server:
  port: 8888

spring:
  application:
    name: mcp-webflux-client-example
  main:
    web-application-type: none
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
    mcp:
      client:
        enabled: true
        name: my-mcp-client
        type: SYNC
        request-timeout: 600s
        streamable-http:
          connections:
            server1:
              url: http://localhost:19000
              endpoint: /mcp
