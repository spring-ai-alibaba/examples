spring:
  autoconfigure:
    exclude: ${MCP_ROUTER_AUTOCONFIG_EXCLUDE:com.alibaba.cloud.ai.autoconfigure.mcp.router.NacosMcpRouterAutoConfiguration}
  application:
    name: mcp-config-example
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:${AI_DASHSCOPE_API_KEY:}}
    mcp:
      server:
        enabled: false
    alibaba:
      mcp:
        router:
          enabled: true
          discovery-order:
            - file
          # MCP file configurations
          services:
            - name: weather-service
              description: "天气查询服务"
              protocol: "http"
              version: "1.0.0"
              endpoint: "http://localhost:8080/weather"
              enabled: true
              tags:
                - "weather"
                - "api"
            - name: translation-service
              description: "翻译服务"
              protocol: "http"
              version: "2.0.0"
              endpoint: "http://localhost:8081/translate"
              enabled: true
              tags:
                - "translation"
                - "nlp"

          database:
            enabled: ${MCP_ROUTER_DATABASE_ENABLED:false}
            url: ${MCP_ROUTER_DATABASE_URL:jdbc:mysql://127.0.0.1:3306/testdb?useSSL=false&serverTimezone=UTC}
            username: ${MCP_ROUTER_DATABASE_USERNAME:root}
            password: ${MCP_ROUTER_DATABASE_PASSWORD:root}
            driver-class-name: ${MCP_ROUTER_DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}
            table-name: ${MCP_ROUTER_DATABASE_TABLE:mcp_server_info}

        nacos:
          server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
          namespace: ${NACOS_NAMESPACE:public}
          username: ${NACOS_USERNAME:nacos}
          password: ${NACOS_PASSWORD:nacos}
